# ============================================================
# 小红书平台适配规则配置
# ============================================================
# 本文件定义了内容发布到小红书时的格式转换、标题限制、
# 语气风格及媒体资源处理规则。小红书以图文笔记为主，
# 内容风格偏向生活化、碎片化。

platform: xiaohongshu

# ---- 标题规则 ----
title:
  max_length: 20                           # 标题最大字符数（小红书标题偏短）
  strategy: truncate_clean                  # 超长截断策略：干净截断（不加省略号）
  add_hashtag: true                         # 标题自动添加话题标签
  add_emoji: true                           # 标题自动添加表情装饰

# ---- 内容规则 ----
# 将Markdown转为小红书风格的纯文本笔记
content:
  output_format: plain                      # 输出格式：纯文本（小红书不支持富文本）
  max_paragraph_length: 15                  # 每段最大行数（控制段落碎片化）
  transforms:                               # 内容转换流水线
    - name: markdown_to_plain               # Markdown转纯文本
    - name: add_emoji_decorations           # 为段落添加表情装饰
    - name: add_hashtags                    # 在文末添加相关话题标签

# ---- 语气风格 ----
tone:
  style: lifestyle                          # 生活化风格（符合小红书社区调性）
  # 关键词到表情的映射表，用于自动匹配内容主题并插入对应表情
  emoji_map:
    推荐: "\U0001F44D"                      # 👍
    教程: "\U0001F4DA"                      # 📚
    好物: "✨"                           # ✨
    美食: "\U0001F35C"                      # 🍜
    旅行: "✈️"                    # ✈️
    穿搭: "\U0001F457"                      # 👗
    护肤: "\U0001F486"                      # 💆
    健身: "\U0001F4AA"                      # 💪
    学习: "\U0001F4D6"                      # 📖
    工作: "\U0001F4BC"                      # 💼
    生活: "\U0001F308"                      # 🌈
    分享: "\U0001F496"                      # 💖
    测评: "\U0001F4DD"                      # 📝
    攻略: "\U0001F5FA️"                # 🗺️
    干货: "\U0001F4CC"                      # 📌

# ---- 媒体资源规则 ----
media:
  image_ratio: "3:4"                        # 图片裁剪比例：3:4竖屏（小红书主流比例）
  image_min_size: 1080                      # 图片最小尺寸（像素）
  image_max_size_mb: 1                      # 图片最大体积（MB，小红书限制较严）
  max_images: 9                             # 单篇笔记最大图片数量
