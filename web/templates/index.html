{% extends "base.html" %}

{% block content %}
<div class="container">
    <!-- AI 一键生成 -->
    <div class="ai-section" id="ai-section">
        <h2>🤖 AI 一键生成</h2>
        <p class="ai-desc">输入一句话描述，AI 帮你生成完整文案并自动适配各平台格式</p>
        <div class="ai-form">
            <div class="ai-input-row">
                <input type="text" id="ai-prompt" placeholder="例如：写一篇关于 Python 异步编程的技术教程" class="ai-input">
                <select id="ai-style" class="ai-select">
                    <option value="general">通用风格</option>
                    <option value="tech-tutorial">技术教程</option>
                    <option value="product-review">产品评测</option>
                    <option value="daily-share">日常分享</option>
                    <option value="industry-analysis">行业分析</option>
                </select>
                <button onclick="aiGenerate()" class="btn btn-primary ai-btn" id="ai-generate-btn">✨ 一键生成</button>
            </div>
            <div class="ai-options">
                <label>
                    <input type="checkbox" id="ai-use-platform"> 针对特定平台优化
                </label>
                <select id="ai-target-platform" class="ai-select-sm" disabled>
                    <option value="wechat">微信公众号</option>
                    <option value="zhihu">知乎</option>
                    <option value="bilibili">B站</option>
                    <option value="xiaohongshu">小红书</option>
                    <option value="douyin">抖音</option>
                    <option value="weibo">微博</option>
                </select>
            </div>
        </div>
        <div id="ai-status" class="ai-status" style="display:none;"></div>
    </div>

    <div class="editor-section">
        <h2>内容编辑</h2>

        <div class="form-group">
            <label for="title">标题</label>
            <input type="text" id="title" placeholder="请输入文章标题" maxlength="100">
            <span class="hint" id="title-hint">0 / 100</span>
        </div>

        <div class="form-group">
            <label for="content">正文 <small>(支持 Markdown 格式)</small></label>
            <div class="editor-toolbar">
                <button onclick="insertMd('**', '**')" title="粗体">B</button>
                <button onclick="insertMd('*', '*')" title="斜体"><i>I</i></button>
                <button onclick="insertMd('`', '`')" title="代码">&lt;/&gt;</button>
                <button onclick="insertMd('\\n## ', '\\n')" title="标题">H</button>
                <button onclick="insertMd('[', '](url)')" title="链接">🔗</button>
                <button onclick="insertMd('\\n> ', '\\n')" title="引用">❝</button>
                <button onclick="insertMd('\\n- ', '\\n')" title="列表">☰</button>
                <button onclick="insertMd('\\n```\\n', '\\n```\\n')" title="代码块">{ }</button>
            </div>
            <textarea id="content" rows="18" placeholder="在这里输入 Markdown 内容..."></textarea>
        </div>

        <div class="form-row">
            <div class="form-group flex-1">
                <label for="tags">标签（逗号分隔）</label>
                <input type="text" id="tags" placeholder="技术, Python, 教程">
            </div>
            <div class="form-group">
                <label>图片</label>
                <div class="image-upload">
                    <input type="file" id="image-input" accept="image/*" multiple onchange="handleImages(this)">
                    <span id="image-count">未选择图片</span>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>目标平台</label>
            <div class="platform-checkboxes" id="platform-list">
                <label><input type="checkbox" value="wechat" checked> 微信公众号</label>
                <label><input type="checkbox" value="zhihu" checked> 知乎</label>
                <label><input type="checkbox" value="bilibili" checked> B站</label>
                <label><input type="checkbox" value="xiaohongshu" checked> 小红书</label>
                <label><input type="checkbox" value="douyin"> 抖音</label>
                <label><input type="checkbox" value="weibo"> 微博</label>
            </div>
        </div>

        <div class="form-group schedule-section" id="schedule-section">
            <label>
                <input type="checkbox" id="enable-schedule" onchange="toggleSchedule()"> ⏰ 定时发布
            </label>
            <div class="schedule-options" id="schedule-options" style="display:none;">
                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="scheduled-time">发布时间</label>
                        <input type="datetime-local" id="scheduled-time" class="schedule-input">
                    </div>
                    <div class="form-group flex-1">
                        <label for="delay-minutes">或延迟发布（分钟）</label>
                        <input type="number" id="delay-minutes" class="schedule-input" placeholder="例如：30" min="1">
                    </div>
                </div>
                <p class="hint" style="margin-top:0.3rem;">💡 定时任务将在后台自动执行，您可以在"任务"页面查看和管理</p>
            </div>
        </div>

        <div class="actions">
            <button onclick="saveDraft()" class="btn btn-secondary">💾 保存草稿</button>
            <button onclick="previewContent()" class="btn btn-secondary">👁 预览</button>
            <button onclick="adaptAndReview()" class="btn btn-secondary" id="btn-adapt">🧪 模拟发布</button>
            <button onclick="schedulePublish()" class="btn btn-primary" id="btn-schedule" style="display:none;">⏰ 定时发布</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="drafts-section">
            <h2>草稿列表</h2>
            <div id="draft-list"></div>
        </div>

        <div class="platform-info-section">
            <h2>平台状态</h2>
            <div id="platform-status"></div>
        </div>
    </div>

    <!-- 适配内容编辑区 -->
    <div class="adapt-section" id="adapt-section" style="display:none;">
        <h2>📝 各平台适配内容 <small style="font-weight:normal;color:#888;">（模拟发布结果，可编辑后正式发布）</small></h2>
        <div class="adapt-tabs" id="adapt-tabs"></div>
        <div id="adapt-content" class="adapt-box">
            <p>请选择一个平台查看适配内容</p>
        </div>
        <div class="adapt-actions">
            <button onclick="confirmPublish()" class="btn btn-primary" id="btn-confirm-publish">🚀 确认正式发布</button>
            <button onclick="closeAdaptSection()" class="btn btn-secondary">✖ 关闭</button>
        </div>
    </div>

    <div class="preview-section" id="preview-section" style="display:none;">
        <h2>平台预览</h2>
        <div class="preview-tabs">
            <button class="tab active" onclick="switchTab('wechat', this)">微信</button>
            <button class="tab" onclick="switchTab('zhihu', this)">知乎</button>
            <button class="tab" onclick="switchTab('bilibili', this)">B站</button>
            <button class="tab" onclick="switchTab('xiaohongshu', this)">小红书</button>
            <button class="tab" onclick="switchTab('douyin', this)">抖音</button>
            <button class="tab" onclick="switchTab('weibo', this)">微博</button>
        </div>
        <div id="preview-content" class="preview-box"></div>
    </div>

    <div class="result-section" id="result-section" style="display:none;">
        <h2>发布结果</h2>
        <div id="publish-results"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const previews = {};
let selectedImages = [];

// 标题字数统计
document.getElementById('title').addEventListener('input', function() {
    document.getElementById('title-hint').textContent = this.value.length + ' / 100';
});

// Markdown 工具栏
function insertMd(before, after) {
    const ta = document.getElementById('content');
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const sel = ta.value.substring(start, end);
    ta.value = ta.value.substring(0, start) + before + sel + after + ta.value.substring(end);
    ta.focus();
    ta.selectionStart = start + before.length;
    ta.selectionEnd = start + before.length + sel.length;
}

// 图片处理
function handleImages(input) {
    selectedImages = Array.from(input.files);
    document.getElementById('image-count').textContent =
        selectedImages.length > 0 ? `已选择 ${selectedImages.length} 张图片` : '未选择图片';
}

// 加载草稿列表
async function loadDrafts() {
    const resp = await fetch('/api/drafts');
    const data = await resp.json();
    const list = document.getElementById('draft-list');
    list.innerHTML = '';
    if (data.drafts.length === 0) {
        list.innerHTML = '<p class="empty">暂无草稿</p>';
        return;
    }
    data.drafts.forEach(d => {
        const div = document.createElement('div');
        div.className = 'draft-item';
        div.innerHTML = `
            <span title="${d.title || '无标题'}">${d.title || '无标题'}</span>
            <div class="draft-actions">
                <button onclick="loadDraft('${d.id}')" title="加载">📂</button>
                <button onclick="deleteDraft('${d.id}')" title="删除">🗑</button>
            </div>
        `;
        list.appendChild(div);
    });
}

// 加载平台状态
async function loadPlatformStatus() {
    const resp = await fetch('/api/platforms');
    const data = await resp.json();
    const div = document.getElementById('platform-status');
    div.innerHTML = '';
    data.platforms.forEach(p => {
        const status = p.has_credentials ? '✅' : '⚠️';
        div.innerHTML += `<div class="platform-status-item">${status} <strong>${p.name}</strong> <small>${p.content_type || ''}</small></div>`;
    });
}

// 保存草稿
async function saveDraft() {
    const title = document.getElementById('title').value;
    const content = document.getElementById('content').value;
    const tags = document.getElementById('tags').value;
    const resp = await fetch('/api/drafts', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({title, content, tags})
    });
    const data = await resp.json();
    if (data.success) {
        showToast('草稿已保存');
        loadDrafts();
    }
}

// 加载草稿
async function loadDraft(id) {
    const resp = await fetch('/api/drafts/' + id);
    const data = await resp.json();
    if (data.success) {
        document.getElementById('title').value = data.draft.title || '';
        document.getElementById('content').value = data.draft.content || '';
        document.getElementById('tags').value = data.draft.tags || '';
        showToast('草稿已加载');
    }
}

// 删除草稿
async function deleteDraft(id) {
    if (!confirm('确定删除此草稿？')) return;
    await fetch('/api/drafts/' + id, {method: 'DELETE'});
    loadDrafts();
}

// 预览
async function previewContent() {
    const title = document.getElementById('title').value;
    const content = document.getElementById('content').value;
    const tags = document.getElementById('tags').value;
    const resp = await fetch('/api/preview', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({title, content, tags})
    });
    const data = await resp.json();
    if (data.success) {
        Object.assign(previews, data.previews);
        document.getElementById('preview-section').style.display = 'block';
        switchTab('wechat', document.querySelector('.tab'));
    }
}

// 切换预览Tab
function switchTab(platform, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    const p = previews[platform];
    if (!p) {
        document.getElementById('preview-content').innerHTML = '<p>暂无预览</p>';
        return;
    }
    if (p.error) {
        document.getElementById('preview-content').innerHTML = `<p class="error">${p.error}</p>`;
        return;
    }
    let html = `<div class="preview-title"><strong>标题：</strong>${escapeHtml(p.title)}</div>`;
    if (p.warnings && p.warnings.length > 0) {
        html += `<div class="preview-warnings">⚠️ ${p.warnings.join(' | ')}</div>`;
    }
    html += `<div class="preview-body"><pre>${escapeHtml(p.content)}</pre></div>`;
    document.getElementById('preview-content').innerHTML = html;
}

// 发布
async function publishContent(real) {
    const title = document.getElementById('title').value;
    const content = document.getElementById('content').value;
    const tags = document.getElementById('tags').value;
    const checkboxes = document.querySelectorAll('#platform-list input:checked');
    const platforms = Array.from(checkboxes).map(cb => cb.value);

    if (!title || !content) {
        alert('请填写标题和内容');
        return;
    }
    if (platforms.length === 0) {
        alert('请至少选择一个平台');
        return;
    }

    if (real && !confirm('确定正式发布？发布后无法撤回。')) return;

    const resp = await fetch('/api/publish', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({title, content, tags, platforms, images: [], real})
    });
    const data = await resp.json();

    if (data.success) {
        document.getElementById('result-section').style.display = 'block';
        const div = document.getElementById('publish-results');
        div.innerHTML = '';
        for (const [platform, result] of Object.entries(data.results)) {
            const status = result.success ? '✅' : '❌';
            const url = result.url ? ` <a href="${result.url}" target="_blank">查看</a>` : '';
            div.innerHTML += `<div class="result-item">${status} <strong>${platform}</strong>: ${result.message}${url}</div>`;
        }
    }
}

// 适配内容缓存
const adaptedContents = {};

// 模拟发布 - 获取各平台适配内容
async function adaptAndReview() {
    const title = document.getElementById('title').value;
    const contentVal = document.getElementById('content').value;
    const tags = document.getElementById('tags').value;
    const checkboxes = document.querySelectorAll('#platform-list input:checked');
    const platforms = Array.from(checkboxes).map(cb => cb.value);

    if (!title || !contentVal) { alert('请填写标题和内容'); return; }
    if (platforms.length === 0) { alert('请至少选择一个平台'); return; }

    const btn = document.getElementById('btn-adapt');
    btn.disabled = true;
    btn.textContent = '⏳ 适配中...';

    try {
        const resp = await fetch('/api/preview', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title, content: contentVal, tags})
        });
        const data = await resp.json();
        if (data.success) {
            Object.keys(data.previews).forEach(platform => {
                const p = data.previews[platform];
                if (!p.error) {
                    adaptedContents[platform] = { title: p.title, content: p.content };
                }
            });
            showAdaptSection(platforms);
        }
    } catch (e) {
        showToast('获取适配内容失败: ' + e.message, 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = '🧪 模拟发布';
    }
}

// 显示适配内容编辑区
function showAdaptSection(platforms) {
    const section = document.getElementById('adapt-section');
    const tabs = document.getElementById('adapt-tabs');
    section.style.display = 'block';
    tabs.innerHTML = '';

    const names = {
        wechat: '微信公众号', zhihu: '知乎', bilibili: 'B站',
        xiaohongshu: '小红书', douyin: '抖音', weibo: '微博'
    };

    const available = platforms.filter(p => adaptedContents[p]);
    available.forEach((platform, index) => {
        const btn = document.createElement('button');
        btn.className = 'adapt-tab' + (index === 0 ? ' active' : '');
        btn.textContent = names[platform] || platform;
        btn.onclick = () => switchAdaptTab(platform, btn);
        tabs.appendChild(btn);
    });

    if (available.length > 0) {
        switchAdaptTab(available[0], tabs.querySelector('.adapt-tab'));
    }
    section.scrollIntoView({behavior: 'smooth'});
}

// 切换适配内容 Tab
function switchAdaptTab(platform, btn) {
    document.querySelectorAll('.adapt-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');

    const data = adaptedContents[platform];
    const box = document.getElementById('adapt-content');
    if (!data) { box.innerHTML = '<p>暂无适配内容</p>'; return; }

    const safeTitle = data.title.replace(/"/g, '&quot;').replace(/</g, '&lt;');
    const safeContent = data.content.replace(/</g, '&lt;').replace(/>/g, '&gt;');

    box.innerHTML = `
        <div class="adapt-field">
            <label><strong>标题</strong> <small style="color:#888;">(${platform})</small></label>
            <input type="text" id="adapt-title-${platform}" value="${safeTitle}" class="adapt-input"
                   onchange="adaptedContents['${platform}'].title = this.value">
        </div>
        <div class="adapt-field">
            <label><strong>正文</strong> <small style="color:#888;">(${platform})</small></label>
            <textarea id="adapt-body-${platform}" class="adapt-textarea" rows="16"
                      onchange="adaptedContents['${platform}'].content = this.value">${safeContent}</textarea>
        </div>
        <div class="adapt-meta">
            <span>📊 标题: ${data.title.length} 字 | 正文: ${data.content.length} 字</span>
        </div>
    `;
}

// 确认正式发布
async function confirmPublish() {
    const title = document.getElementById('title').value;
    const contentVal = document.getElementById('content').value;
    const tags = document.getElementById('tags').value;
    const platforms = Object.keys(adaptedContents);

    if (platforms.length === 0) { alert('没有可发布的内容'); return; }

    // 同步 textarea 中的编辑内容
    platforms.forEach(platform => {
        const titleInput = document.getElementById(`adapt-title-${platform}`);
        const bodyTextarea = document.getElementById(`adapt-body-${platform}`);
        if (titleInput) adaptedContents[platform].title = titleInput.value;
        if (bodyTextarea) adaptedContents[platform].content = bodyTextarea.value;
    });

    if (!confirm(`确定正式发布到 ${platforms.length} 个平台？发布后无法撤回。`)) return;

    const btn = document.getElementById('btn-confirm-publish');
    btn.disabled = true;
    btn.textContent = '⏳ 发布中...';

    try {
        const resp = await fetch('/api/publish', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                title, content: contentVal, tags, platforms, images: [],
                real: true,
                adapted_contents: adaptedContents
            })
        });
        const data = await resp.json();

        if (data.success) {
            document.getElementById('result-section').style.display = 'block';
            const div = document.getElementById('publish-results');
            div.innerHTML = '';
            for (const [platform, result] of Object.entries(data.results)) {
                const status = result.success ? '✅' : '❌';
                const url = result.url ? ` <a href="${result.url}" target="_blank">查看</a>` : '';
                div.innerHTML += `<div class="result-item">${status} <strong>${platform}</strong>: ${result.message}${url}</div>`;
            }
            document.getElementById('result-section').scrollIntoView({behavior: 'smooth'});
            showToast('发布完成');
        }
    } catch (e) {
        showToast('发布失败: ' + e.message, 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = '🚀 确认正式发布';
    }
}

// 关闭适配编辑区
function closeAdaptSection() {
    document.getElementById('adapt-section').style.display = 'none';
}

// ── 定时发布 ──
function toggleSchedule() {
    const enabled = document.getElementById('enable-schedule').checked;
    document.getElementById('schedule-options').style.display = enabled ? 'block' : 'none';
    document.getElementById('btn-schedule').style.display = enabled ? 'inline-block' : 'none';
}

async function schedulePublish() {
    const title = document.getElementById('title').value;
    const contentVal = document.getElementById('content').value;
    const tags = document.getElementById('tags').value;
    const checkboxes = document.querySelectorAll('#platform-list input:checked');
    const platforms = Array.from(checkboxes).map(cb => cb.value);
    const scheduledTime = document.getElementById('scheduled-time').value;
    const delayMinutes = document.getElementById('delay-minutes').value;

    if (!title || !contentVal) { alert('请填写标题和内容'); return; }
    if (platforms.length === 0) { alert('请至少选择一个平台'); return; }

    // 构建请求体
    const body = { title, content: contentVal, tags, platforms, images: [] };
    if (scheduledTime) {
        body.scheduled_at = new Date(scheduledTime).toISOString();
    } else if (delayMinutes) {
        body.delay_seconds = parseInt(delayMinutes) * 60;
    } else {
        alert('请设置发布时间或延迟分钟数');
        return;
    }

    const btn = document.getElementById('btn-schedule');
    btn.disabled = true;
    btn.textContent = '⏳ 创建定时任务...';

    try {
        const resp = await fetch('/api/schedule', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        });
        const data = await resp.json();
        if (data.success) {
            const info = Object.entries(data.results).map(([p, r]) =>
                `${p}: 将于 ${new Date(r.scheduled_at).toLocaleString('zh-CN')} 发布`
            ).join('\n');
            alert(`✅ 定时任务已创建！\n\n${info}\n\n您可以在"任务"页面查看和管理定时任务。`);
            // 重置定时发布选项
            document.getElementById('enable-schedule').checked = false;
            toggleSchedule();
        } else {
            alert('创建失败: ' + (data.message || '未知错误'));
        }
    } catch (e) {
        alert('网络错误: ' + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = '⏰ 定时发布';
    }
}

// Toast 提示
function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
}

// HTML 转义
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// AI 一键生成
document.getElementById('ai-use-platform').addEventListener('change', function() {
    document.getElementById('ai-target-platform').disabled = !this.checked;
});

async function aiGenerate() {
    const prompt = document.getElementById('ai-prompt').value.trim();
    if (!prompt) {
        showToast('请输入内容描述', 'error');
        return;
    }

    const btn = document.getElementById('ai-generate-btn');
    const status = document.getElementById('ai-status');
    const style = document.getElementById('ai-style').value;
    const usePlatform = document.getElementById('ai-use-platform').checked;
    const platform = usePlatform ? document.getElementById('ai-target-platform').value : null;

    btn.disabled = true;
    btn.textContent = '⏳ 生成中...';
    status.style.display = 'block';
    status.className = 'ai-status ai-loading';
    status.textContent = '正在调用 AI 生成内容，请稍候...';

    try {
        const resp = await fetch('/api/ai/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ prompt, style, platform }),
        });
        const data = await resp.json();

        if (data.success) {
            // 填充到编辑器
            document.getElementById('title').value = data.title || '';
            document.getElementById('content').value = data.content || '';
            document.getElementById('tags').value = (data.tags || []).join(', ');

            // 更新标题字数统计
            document.getElementById('title-hint').textContent =
                (data.title || '').length + ' / 100';

            status.className = 'ai-status ai-success';
            status.textContent = '✅ 生成成功！内容已填充到编辑器，您可以继续编辑或直接发布。';
            showToast('AI 内容生成成功');
        } else {
            status.className = 'ai-status ai-error';
            status.textContent = '❌ ' + (data.error || '生成失败');
            showToast(data.error || '生成失败', 'error');
        }
    } catch (e) {
        status.className = 'ai-status ai-error';
        status.textContent = '❌ 网络错误: ' + e.message;
        showToast('网络错误', 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = '✨ 一键生成';
    }
}

// 初始化
loadDrafts();
loadPlatformStatus();
</script>
{% endblock %}
