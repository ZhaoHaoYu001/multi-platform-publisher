<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}多平台内容发布器{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>多平台内容发布器</h1>
        <nav>
            <a href="/">编辑</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>Multi-Platform Publisher &copy; 2026</p>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
